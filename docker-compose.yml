services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: autorag
      POSTGRES_PASSWORD: autorag
      POSTGRES_DB: autorag
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U autorag"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build: ./backend
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000
    env_file: ./backend/.env
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  worker:
    build: ./backend
    command: celery -A app.workers.celery_app.celery worker --loglevel=info
    env_file: ./backend/.env
    depends_on:
      - api
      - redis

  beat:
    build: ./backend
    command: celery -A app.workers.celery_app.celery beat --loglevel=info
    env_file: ./backend/.env
    depends_on:
      - redis

  frontend:
    build: ./frontend
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_BASE_URL=http://localhost:8000/api/v1
    depends_on:
      - api

volumes:
  pgdata:
