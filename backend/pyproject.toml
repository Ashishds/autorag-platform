[project]
name = "autorag-backend"
version = "0.1.0"
description = "AutoRAG — autonomous RAG optimization platform (MVP backend)"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "python-multipart>=0.0.12",
    "sse-starlette>=2.1",
    # Data access
    "asyncpg>=0.30",
    "psycopg[binary]>=3.1.0",
    "supabase>=2.9",
    "alembic>=1.13",
    "redis>=5.2",
    # Orchestration / jobs
    "celery>=5.4",
    "langgraph>=0.2.45",
    "langgraph-checkpoint-postgres>=2.0",
    # Models / providers
    "google-genai>=0.3",
    "openai>=1.54",
    "cohere>=5.11",
    # Document processing
    "unstructured>=0.16",
    "pdfplumber>=0.11",
    "openpyxl>=3.1",
    "python-pptx>=1.0",
    "tiktoken>=0.8",
    "jinja2>=3.1",
    # Evaluation
    "ragas>=0.2",
    # Utilities
    "tenacity>=9.0",
    "structlog>=24.4",
    "httpx>=0.27",
    "langfuse>=2.0.0",
    "beautifulsoup4>=4.12.0",
    "youtube-transcript-api>=0.6.0",
    "aioboto3>=13.0",
    "google-auth-oauthlib>=1.0.0",
    "notion-client>=2.0.0",
    "dropbox>=12.0",
    "msgraph-core>=1.0.0",
    "azure-identity>=1.15.0",
    "pyjwt>=2.8",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.7",
    "mypy>=1.13",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["B008", "UP042", "UP046"]

[tool.ruff.lint.per-file-ignores]
"alembic/**" = ["E501"]
"app/config.py" = ["E402"]
"app/repositories/**" = ["E501"]
"app/services/pii/service.py" = ["E501"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
